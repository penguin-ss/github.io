<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#18243a">
  <meta name="description" content="宿題QRの共有カメラ画面。カメラ画像は保存・送信しません。">
  <title>宿題QR｜共有カメラ</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="page-shell">
    <header class="app-header">
      <div class="brand-mark" aria-hidden="true">宿</div>
      <div>
        <p class="eyebrow">宿題QR</p>
        <h1>共有カメラ</h1>
      </div>
      <span id="connectionBadge" class="connection-badge">GAS接続待ち</span>
    </header>

    <section class="viewer-card" aria-labelledby="heading">
      <div class="section-heading">
        <div>
          <p class="eyebrow">高速連続読取</p>
          <h2 id="heading">ノートのQRを枠に入れる</h2>
        </div>
        <span id="scanCount" class="count-badge" aria-live="polite">本日の読取 0</span>
      </div>

      <div id="cameraFrame" class="camera-frame">
        <video id="cameraPreview" autoplay muted playsinline aria-label="QR読取りカメラ"></video>
        <div class="scan-guide" aria-hidden="true"><span></span></div>
        <div id="scanFeedbackOverlay" class="scan-feedback-overlay" role="status" aria-live="assertive" aria-atomic="true" hidden>
          <span class="scan-feedback-icon" aria-hidden="true">✓</span>
          <strong id="scanFeedbackTitle">読み取り完了</strong>
          <span id="scanFeedbackDetail">送信中</span>
        </div>
        <div id="cameraMessage" class="camera-message">
          <strong>GAS画面から起動してください</strong>
          <span>カメラ画像は保存・送信せず、匿名トークンだけを元の画面へ返します。</span>
        </div>
      </div>

      <div class="viewer-footer">
        <p id="liveStatus" class="live-status" role="status" aria-live="polite">GAS画面との接続を待っています</p>
        <p id="cameraControlsStatus" class="camera-controls-status" role="status" aria-live="polite">外カメラ・左右反転なし</p>
        <div class="camera-options" aria-label="カメラ設定">
          <button id="switchCameraButton" class="secondary-button camera-option-button" type="button" disabled>内カメラに切り替え</button>
          <button id="mirrorButton" class="secondary-button camera-option-button" type="button" disabled aria-pressed="false">左右反転：OFF</button>
        </div>
        <div class="button-row">
          <button id="cameraButton" class="primary-button" type="button" disabled>カメラを開始</button>
          <button id="closeButton" class="secondary-button" type="button">画面を閉じる</button>
        </div>
      </div>
    </section>

    <section class="tip-card" aria-label="使い方">
      <div class="tip-number">1</div>
      <div>
        <strong>ノートを順番にかざすだけ</strong>
        <p>読み取ったQRは固定トークンとして元のGAS画面へ返されます。氏名や名簿はこのページにありません。</p>
      </div>
    </section>

    <p id="lastRead" class="last-read" hidden></p>
  </main>
  <script src="./vendor/zxing-browser.min.js"></script>
  <script src="./scanner.js?v=0.17.0" defer></script>
</body>
</html>
